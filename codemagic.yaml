workflows:
  android-workflow:
    name: BLA NET Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Prepare Flutter project
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart

          flutter create --platforms=android --org com.blanet --project-name app .

          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle")
          content = file.read_text()

          plugin = '    id "com.google.gms.google-services" version "4.4.2"'

          if "com.google.gms.google-services" not in content:
              content = content.replace(
                  "plugins {",
                  "plugins {\n" + plugin,
                  1
              )

          file.write_text(content)
          PY

          flutter pub get

          cd android
          ./gradlew signingReport
          cd ..

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
