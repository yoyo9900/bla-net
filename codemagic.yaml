
workflows:
  android-workflow:
    name: BLA NET Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Prepare Flutter project
        script: |
          set -e

          flutter create --platforms=android --org com.blanet --project-name app .

          mkdir -p lib
          cp main.dart lib/main.dart

          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app.exists():
              raise SystemExit("Gradle Kotlin files were not found")

          content = settings.read_text()
          plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false'

          if "com.google.gms.google-services" not in content:
              content = content.replace("plugins {", "plugins {\n" + plugin, 1)

          settings.write_text(content)

          content = app.read_text()
          plugin = '    id("com.google.gms.google-services")'

          if "com.google.gms.google-services" not in content:
              content = content.replace("plugins {", "plugins {\n" + plugin, 1)

          app.write_text(content)
          PY

          mkdir -p "$HOME/.android"
          mkdir -p /usr/local/share/android-sdk/.android

          if [ ! -f /usr/local/share/android-sdk/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /usr/local/share/android-sdk/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cp /usr/local/share/android-sdk/.android/debug.keystore "$HOME/.android/debug.keystore"

          flutter pub get

          cd android
          ./gradlew signingReport
          cd ..

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
